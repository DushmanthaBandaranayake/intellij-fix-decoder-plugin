import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.16.0'
}

group = 'com.dush'
version = '1.0.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

// No toolchain: compile with whichever JDK Gradle itself runs on (21 or newer, because the
// 2026.1 platform classes on the compile classpath are Java 21 class files).
// The output must still be Java 11 bytecode: IDE 2021.3 runs on a Java 11 runtime.
java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

processResources {
    from('LICENSE') { into 'META-INF' }   // ship the licence inside the plugin jar
}

tasks.named('compileJava') {
    options.release = 11   // also rejects JDK APIs newer than 11
}

tasks.named('compileTestJava') {
    options.release = 21   // tests run only against the 2026.1 platform, so they may use its Java version
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    intellijPlatform {
        // Compile against the newest platform and rely on verifyPlugin (below) for older ones:
        // this Gradle plugin cannot compile against anything older than 2022.3.
        intellijIdea('2026.1')
        bundledPlugin('com.intellij.java')
        pluginVerifier()
        testFramework(TestFrameworkType.Platform.INSTANCE)
        testFramework(TestFrameworkType.Plugin.Java.INSTANCE)
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.opentest4j:opentest4j:1.3.0'
}

intellijPlatform {
    // Skips the :instrumentCode task (only needed for .form GUI files and some nullability annotations; this plugin uses neither)
    instrumentCode = false
    // There is a settings page (Settings > Tools > FIX Decoder); index it so the Settings search box finds its options.
    buildSearchableOptions = true

    pluginConfiguration {
        ideaVersion {
            sinceBuild = '213'          // 2021.3
            untilBuild = provider { null }   // no upper limit
        }
    }

    // ./gradlew verifyPlugin checks the built plugin's bytecode against each of these IDEs.
    // The compiler only sees 2026.1, so run this after any change to the IntelliJ APIs used.
    pluginVerification {
        ides {
            create('IC', '2021.3')
            create('IC', '2022.3')
            create('IC', '2023.3')
            create('IC', '2024.3')
            create('IC', '2025.2')      // last separate Community release
            create('IU', '2026.1')
            create('IU', '2026.2')
        }
    }

    // ./gradlew publishPlugin uploads to JetBrains Marketplace. Keep the token out of this file:
    // pass it through the PUBLISH_TOKEN environment variable.
    publishing {
        token = providers.environmentVariable('PUBLISH_TOKEN')
    }
}
